name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, mbstring, fileinfo, intl, exif
          coverage: none

      - name: Installer Poppler (miniatures PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist

      - name: Preparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        if: matrix.php == '8.3'
        run: php vendor/bin/pint --test

      - name: Tests (Pest)
        run: php vendor/bin/pest --compact

  tests-mysql:
    runs-on: ubuntu-latest
    name: MySQL 8.4 (PHP 8.3)

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: cms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, mbstring, fileinfo, intl, exif
          coverage: none

      - name: Installer Poppler (miniatures PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist

      - name: Preparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (Pest sur MySQL)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cms_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php vendor/bin/pest --compact

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Front (Vite)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances npm
        run: npm ci

      - name: Build (un avertissement est un defaut)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -qi "warn" build.log; then
            echo "::error::Le build Vite a emis un avertissement"
            exit 1
          fi