name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v7

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, mbstring, fileinfo, intl, exif
          coverage: none

      - name: Installer Poppler (miniatures PDF)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist

      - name: Preparer l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        if: matrix.php == '8.3'
        run: php vendor/bin/pint --test

      - name: Tests (Pest)
        run: php vendor/bin/pest --compact
